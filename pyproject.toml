[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-team-loop-cli"
version = "0.1.1"
description = "Workspace-scoped agent teams and governed repair loops through Herdr"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
herdr-team-loop-cli = "herdr_team_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
herdr_team_loop = ["assets/**/*.md"]
